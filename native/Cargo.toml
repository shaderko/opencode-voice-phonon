[package]
name = "voice-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local streaming voice prompts for OpenCode, powered by Phonon-2.5"
build = "build.rs"

[lib]
name = "voice_core"
path = "src/lib.rs"

[[bin]]
name = "voice-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
hound = "3.5"
ctrlc = "3.4"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
